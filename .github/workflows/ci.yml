name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The self-tests and the test suite must not reach the network or a model.
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Tests
        run: uv run pytest
      - name: Self-test (fake:obedient)
        run: uv run drum run --target twin --set public_v1 --model fake:obedient --reports-dir reports-ci
      - name: Self-test (fake:safe)
        run: uv run drum run --target twin --set public_v1 --model fake:safe --reports-dir reports-ci
      # The stand-in server on 127.0.0.1 through the HTTP target adapter (M2).
      - name: Self-test, stand-in (fake:obedient)
        run: >-
          uv run drum run --target stub --set public_v1 --model fake:obedient
          --vectors direct,indirect_doc --reports-dir reports-ci
      - name: Self-test, stand-in (fake:safe)
        run: >-
          uv run drum run --target stub --set public_v1 --model fake:safe
          --vectors direct,indirect_doc --reports-dir reports-ci

  audit:
    # Known vulnerabilities in every locked dependency, dev tools included. The tool versions in
    # the run lines are pinned by hand (docs/dependencies.md); Dependabot does not update them.
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Export locked dependencies
        run: >-
          uv export --frozen --format requirements-txt --no-emit-project
          --output-file "$RUNNER_TEMP/requirements.txt"
      - name: Audit with pip-audit
        run: |
          # The ignore list (tools/audit_ignores.toml) needs a reason and an expiry per entry.
          ignores="$(uv run --no-project tools/audit_ignores.py)"
          # One --ignore-vuln=<id> per word, so $ignores stays unquoted on purpose.
          # shellcheck disable=SC2086
          uvx pip-audit@2.10.1 --strict --disable-pip --require-hashes --progress-spinner off \
            --requirement "$RUNNER_TEMP/requirements.txt" $ignores

  zizmor:
    # Workflow and Dependabot lint. The job token (contents: read) enables zizmor's online audits,
    # for example that every pinned SHA belongs to its action's repository.
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Lint workflows and Dependabot config
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.32.0 --persona pedantic --min-severity low .github/
