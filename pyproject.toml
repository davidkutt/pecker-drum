[project]
name = "pecker-drum"
version = "0.1.0"
description = "Red-team harness for RAG apps and agents with deterministic grading and honest statistics."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "davidkutt" }]
dependencies = [
    "fastembed~=0.9.1",
    "langchain~=1.5.2",
    "langchain-core~=1.8.4",
    "langchain-openai~=1.8.5",
    "langgraph~=1.2.24",
    "langgraph-checkpoint-sqlite~=3.1.3",
    "llama-index-core~=0.14.26",
    "pydantic~=2.14.4",
    "python-dotenv~=1.2.4",
]

[project.scripts]
drum = "pecker_drum.cli:main"

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    "markdown-it-py~=4.3.0",
    "pyright~=1.1.414",
    "pytest~=9.2.0",
    "pytest-asyncio~=1.5.0",
    "ruff~=0.17.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "PT", "ASYNC", "C4", "PIE", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["src", "tests", "tools"]
strict = ["src", "tools"]
# tools/ holds dev-only scripts (not part of the package); tests import them by module name.
extraPaths = ["tools"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = [
    # LangGraph drops queued (never started) attempt coroutines when a run is interrupted.
    "ignore:coroutine 'arun_with_retry' was never awaited:RuntimeWarning",
]
